risks:
  - Tier 6 remains unsolved and requires a width-128 generalization path.
  - Width-128 labels and evaluation require Python big integers while inference must remain tensor-native.
  - CPU-only training makes indiscriminate sweeps infeasible.
  - Public benchmark inputs must not become a model-selection surface.
  - Widths above 63 bits require a Python-bigint offline sampler and tensor-native model inputs.
  - Candidate 004 clears Tier 5 but remains only 49.5 to 50.1 percent overall, far below the 85 percent goal.
  - Progressive teacher-forced width scaling regresses width-128 rollout from 57 to 49 percent despite 99.7 percent transition accuracy, indicating autonomous state drift.
  - Proper PyG GCN, GATv2, and max-MessagePassing bit-position graphs underperform the cellular control and produce zero rollout at the matched 1,200-update budget.
  - The cellular finite-data probe reaches memorization but shows no reproducible delayed-generalization signature under 0 or 1e-2 weight decay.
  - Proper PyG max-MPNN generalizes concurrently while TCN memorizes and plateaus; neither shows a reproducible delayed-generalization signature.
  - Balanced replay of exact model-mined first-error transitions regresses fresh width-128 rollout by 1.33 points and slightly misses transition accuracy despite majority uniform replay.
