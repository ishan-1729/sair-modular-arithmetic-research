risks:
  - Candidate 005 clears Tier 6 across five seeds but reaches only 59.3 to 59.5 percent overall because Tiers 7-10 remain unsolved.
  - Candidate 005 currently has no learned inference path above 128 bits; EXP-649 invokes the raw cellular checkpoint at width 256 only as a frozen research diagnostic.
  - Width-128 labels and evaluation require Python big integers while inference must remain tensor-native.
  - CPU-only training makes indiscriminate sweeps infeasible.
  - Public benchmark inputs must not become a model-selection surface.
  - Widths above 63 bits require a Python-bigint offline sampler and tensor-native model inputs.
  - Five complete independent 1,100-case seeds are not yet warranted because the current zero fallback above Tier 6 structurally prevents the 85 percent overall gate.
  - Progressive teacher-forced width scaling regresses width-128 rollout from 57 to 49 percent despite 99.7 percent transition accuracy, indicating autonomous state drift.
  - Proper PyG GCN, GATv2, and max-MessagePassing bit-position graphs underperform the cellular control and produce zero rollout at the matched 1,200-update budget.
  - The cellular finite-data probe reaches memorization but shows no reproducible delayed-generalization signature under 0 or 1e-2 weight decay.
  - Proper PyG max-MPNN generalizes concurrently while TCN memorizes and plateaus; neither shows a reproducible delayed-generalization signature.
  - Balanced replay of exact model-mined first-error transitions regresses fresh width-128 rollout by 1.33 points and slightly misses transition accuracy despite majority uniform replay.
  - Coarse target-free modulus and operand groups show at most 1.30x training and 1.43x validation failure enrichment, below the twofold authorization gate.
  - Complementary bootstrap-trained output heads create trajectory disagreement but regress width-128 exact rollout by 1.67 points and perform one point below randomized heads.
  - The hierarchical composition tree learns up to 60.83 percent exact internal nodes but zero exact roots at width 16 and zero exact width-32 products after 2,400 updates.
  - Compact recurrent relative attention ties direct dilated convolution at 0.667 percent exact width 12 and both have zero exact width-24 transfer; trained attention shows no exact-answer advantage over randomized weights.
  - Independent cellular diversity is strong at width 16 but the staged width-64 lineage reaches only 68.83 percent rollout; target-free routing adds one point to the 94 percent incumbent and misses its gain/runtime gates.
  - Teacher distillation lifts compressed radix-4 transition accuracy only at widths 16/32 and regresses width 64; one-cycle phase 2 remains inaccurate even on exact intermediate states, causing zero rollout above width 16.
  - Full-depth continuous macro state is viable on training identities and gains only one net width-64 case over hard composition; held-out width-128 benefit remains unmeasured.
  - Full-depth continuous adaptation regresses fresh width-128 rollout from 82.67 percent hard-frozen to 80.67 percent trained and misses transition/runtime gates; close the soft-boundary training surface.
  - Commutative operand swapping yields 97 percent fixed-selector accuracy and 98.33 percent oracle union on consumed width-128 cases, but unconditional double inference projects to 318.62 seconds and requires conditional routing.
  - The fixed 40 percent conditional commutative route preserves 96.67 percent consumed accuracy with a 212.66-second projection; fresh confirmation is mandatory before integration.
  - The exact conditional route confirms at 97.2 percent on 500 fresh width-128 cases with 99.933 percent transition and 113.81-second projection; full candidate and wider-width gates remain outstanding.
  - EXP-643 preserves 99.7 percent width-256 transition accuracy but reaches only 22 and 32 percent autonomous rollout across two seeds; zero overthinking and sub-0.81 late gain proxies reject recurrent-depth instability as the primary supported cause.
  - EXP-654's addressable neural RAM and non-addressable workspace both score zero exact even at trained width 16 after 4,000 updates; nearly uniform addressing and zero ablation/dependence drops reject the current latent-executor formulation before scale-up.
  - EXP-654's parameter-matched decoded wider control improves trained-width exactness from 85.33 to 94.33 percent but still scores zero exact at widths 24 and 32, so added state capacity alone does not transfer.
  - EXP-647's endpoint consistency retains width-64 and is deterministic but regresses original width-128/256 rollout by 1.67/2.5 points, misses transition, validity, and runtime gates, and does not authorize Tier-7 or candidate promotion.
  - EXP-649's six-path choice comes only from a hypothetical independence calculation on the related EXP-647 challenger's 47.5 percent union; it is not matched Candidate-005 evidence and could miss breadth or runtime immediately.
  - EXP-649 calibration root 20261148 is permanently retired because a scaffold parity test computed official-reference labels for its 1,100 identities in memory; no label was inspected or persisted, but only audited replacement root 20261150 may be used input-only after the clean scaffold gate.
  - EXP-649's first implementation-readiness audit rejected calibration launch because sigma-zero controls did not retain every decoded prefix, runaway enforcement was only stage-end, formal compatibility omitted three provenance hashes, and retirement lacked a pinned machine-readable manifest; these are scaffold blockers, not experiment results.
  - EXP-649 completed its full-fidelity input-only calibration but misses the wall gate by more than an order of magnitude: 3150.892 seconds projected versus 285 seconds allowed. Formal root 20261149 remains unopened; no oracle, accuracy, breadth, selector, voting, tuning, candidate-promotion, or Goal-completion claim is authorized.
  - EXP-648's natural K=8 endpoint objective is untested; it may recover pre-first-error windows or may introduce drift into already successful trajectories, so both directions and first-error movement are binding paired gates.
  - EXP-648 corpus construction succeeded with 512 exact start-index, modulus-bit-length, and normalized-band matches from 736 identities; those frozen strata and counts cannot be weakened or rematched after observing the corpus.
  - EXP-648 corpus evidence was executed at repository HEAD 9f2226873a66e1938dbf30d87acbc876e528c622 with the scientific runner and focused test absent from HEAD; the execution worktree was dirty and its exact complete dirty set is unavailable, so the scoped provenance amendment and byte hashes are binding limitations.
  - EXP-648 run.json and MLflow metrics preserve the immutable pre-MLflow workload snapshot at 2505.754850685 wall / 10103.335504912 aggregate-CPU seconds; mlflow.json final_resource_timing is authoritative for the 2508.171222396 wall / 10104.265504912 aggregate-CPU-second end-to-end total. Numeric first-quarter checkpoint telemetry was not serialized, although the fail-closed pass is recorded.
  - EXP-648's historical calibration root 20261151 predates the hardened screen workload and cannot authorize it. Root 20261159 is now consumed but rejected/superseded because additions were post hoc rather than synchronously validated and sealed; its timings may inform conservative planning only and cannot supply launch, rates, or caches.
