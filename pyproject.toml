[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sair-modular-arithmetic-research"
version = "0.1.0"
description = "Reproducible research and submission workspace for the SAIR Modular Arithmetic Challenge"
requires-python = ">=3.12,<3.14"
dependencies = [
  "jsonschema>=4.23,<5",
  "numpy>=1.26,<3",
  "pypdf>=6,<7",
  "PyYAML>=6,<7",
  "safetensors>=0.4.5,<1",
  "torch>=2.2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]
research = [
  "mlflow==3.14.0",
  "psutil==7.0.0",
  "sympy==1.13.1",
  "torch-geometric==2.8.0",
  "transformers==5.14.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pocs*", "sair_mod*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "slow: training or long-running evaluation",
]
