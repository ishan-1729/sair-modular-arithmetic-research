library_decision: Native PyTorch supplies deterministic grouped top-1 routing, index_select/index_copy, convolution, and autograd without adding a runtime dependency; no external library materially improves this fixed CPU tensor route.
quota_contract: Consecutive complete groups of four are eligible; exactly one example per group is routed, and any final incomplete group is explicitly ineligible and base-only. Learned and random arms therefore have the identical per-step route histogram without batch-global top-k or load collapse.
