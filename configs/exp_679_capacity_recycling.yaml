run_id: exp-679-capacity-recycling
status: frozen-source-grounded-ST-M043b-package
hypothesis: >-
  Reducing Candidate005 recurrent visits and reinvesting only measured resource
  headroom into exactly embedded learned channels can retain W128 and create W256
  transfer inside the frozen Candidate005 inference envelope.
tracking: {experiment_name: sair-modular-arithmetic-wsl}
preregistration: knowledge/autoresearch/ablations/exp-679-capacity-recycling.md
mechanism_map: knowledge/autoresearch/research/2026-07-30-exp679-capacity-recycling-mechanism.md
source_contract:
