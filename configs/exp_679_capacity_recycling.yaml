  checked_independent_official_private_candidate_submission_promotion: prohibited
source_mapping:
  authenticated_claim: >-
    Loopie reduces stored depth, measures activation and optimizer-step headroom,
    reinvests realized efficiency in width/depth, and selects by end-to-end time.
  sair_analogue: >-
    Preserve Candidate005's operand scan and learned decoder; deterministically
    subsample recurrent visits, then select a wider exact embedding using resources only.
  exclusions: [M043.a-fixed-R2-schedule, M043.c-MoE, M009.b-learned-routing, answer-dependent-depth, microbatch-scaling-claim]
library_decision:
  selected: native-pytorch-profiler-plus-psutil-resource
  torch: 2.5.1+cpu
  license: BSD-3-Clause
  reason: Maintained native CPU profiling measures operator memory and time; no external library improves dense-route fidelity.
embedding:
  equations:
    old_state: h_old_next = Candidate005_update(h_old, x, dilation)
    extra_state: h_extra_next = learned_extra_update(h_extra, x, dilation)
    logits: source_logits(h_old) + W_extra_local(h_extra)
    quotient: source_quotient(h_old) + W_extra_quotient(pool(h_extra))
  initialization: extra readout matrices and biases are exactly zero
  reference_route: full Candidate005 dilation schedule
  expected_identity: bitwise source logits and quotient logits at initialization
model: {source_hidden: 92, cycles: 2}
grid:
  reference_w128_calls: 14
  reduced_calls_w128: [8, 10]
  total_hidden_widths: [104, 112]
  route_rule: evenly-spaced-source-order-indices-including-first-and-last
  width_rule: total hidden width includes the exact 92-channel source subspace
  frozen_before_profiling: true
selection:
  label_free: true
  filters: [exact_embedding, guarded_candidate_no_slower_than_frozen, rss_within_frozen_headroom, activation_within_frozen_headroom]
  order: [largest_total_hidden, lowest_guarded_wall, lowest_peak_rss, lowest_call_count]
  forbidden_inputs: [labels, answers, exact_accuracy, transition_accuracy, validity, loss]
arms:
  capacity_recycled: {train: true, kind: mixed, route: selected_reduced, width: selected_wider, initialization: embedded_exp609}
  reduced_only: {train: true, kind: mixed, route: selected_reduced, width: 92, initialization: exp609}
  wider_full: {train: true, kind: mixed, route: full, width: selected_wider, initialization: embedded_exp609}
  standard_full: {train: true, kind: mixed, route: full, width: 92, initialization: exp609}
  frozen_source: {train: false, kind: mixed, route: full, width: 92, initialization: exp609}
