  authorization: prohibited-until-screen-pass-and-separate-judge-authorization
  pairs: 2
  continuation_from_screen: false
  initialization: each-pair-fresh-matched-clones-from-the-raw-source-checkpoint
  updates_per_arm_per_pair: 400
  evaluation_per_pair:
    paired_identical_inputs: true
    transition_cases: {128: 2000, 256: 2000}
    full_rollout_cases: {64: 200, 128: 200, 256: 500}
    exact_repeat_width: 256
    exact_repeat_cases: 20
  gates_per_pair:
    minimum_width256_rollout_gain: 0.03
    minimum_first_error_mean_delta: 0.0
    minimum_width64_rollout_delta: -0.01
    minimum_width128_rollout_delta: -0.01
    minimum_challenger_width256_transition_accuracy: 0.995
    maximum_challenger_invalid_rollout_rate: 0.01
    require_exact_repeat_and_determinism: true
    require_integrity: true
  pooled_width256_paired_cases: 1000
  pooled_exact_conditional_bound:
    recovered_symbol: b
    introduced_drift_symbol: c
    denominator: 1000
    alpha: 0.05
    sidedness: one-sided
    conditional_success_parameter: b / (b + c)
    clopper_pearson_lower: "0 if b == 0; otherwise BetaQuantile(0.05, b, c + 1)"
    net_exact_gain_lower: (2 * clopper_pearson_lower - 1) * (b + c) / 1000
    no_discordant_cases_rule: "if b + c == 0, net_exact_gain_lower = 0"
    gate: net_exact_gain_lower > 0
  decision_if_any_pair_or_pooled_gate_misses: reject-frozen-confirmation
  interpretation_if_all_gates_pass: supports-only-a-separate-candidate-and-tier7-preregistration
