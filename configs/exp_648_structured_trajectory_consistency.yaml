corpus:
  width: 256
  source_execution: frozen-source-autonomous-rollout
  split_role: generated-training-identities-only
  benchmark_identities_allowed: false
  target_failure_windows: 512
  target_success_windows: 512
  matched_pairs: 512
  window_length: 8
  synthetic_state_corruption: prohibited
  state_bit_flips_or_injections: prohibited
  failure_window:
    first_error_indexing: zero-based-first-wrong-transition
    maximum_first_error_index: 248
    start_state: exact-prefix-immediately-before-first-wrong-transition
    eligibility: a-complete-eight-transition-window-must-fit-from-that-prefix
  success_window:
    start_state: exact-prefix-at-the-matched-start-index
    eligibility: all-eight-autonomous-transitions-from-that-exact-prefix-are-exact
  normalized_modulus_band:
    definition: modulus / (2 ** modulus.bit_length())
    range: "[0.5, 1.0)"
    bins:
      - {id: b0, lower_inclusive: 0.500, upper_exclusive: 0.625}
      - {id: b1, lower_inclusive: 0.625, upper_exclusive: 0.750}
      - {id: b2, lower_inclusive: 0.750, upper_exclusive: 0.875}
      - {id: b3, lower_inclusive: 0.875, upper_exclusive: 1.000}
  matching:
    ratio: one-success-to-one-failure
    exact_fields: [window_start_index, modulus_bit_length, normalized_modulus_band]
    failure_order: corpus-root-generated-identity-and-trajectory-order
    success_tie_order: first-unused-eligible-success-in-corpus-root-generated-order
    fallback_or_relaxation: prohibited
  exact_offline_teacher:
    allowed: true
    scope: corpus-label-generation-and-evaluation-only
    inference_use: prohibited
  freeze_before_training:
    - identity_manifest_sha256
    - trajectory_manifest_sha256
    - source_checkpoint_sha256
    - exact_teacher_source_sha256
    - corpus_artifact_sha256
  resolved_corpus_mining_ceiling: pending-full-fidelity-calibration
  shortfall_decision: corpus-construction-failure-no-weakened-matching-or-count

matched_arms:
  common_initialization:
    method: independent-clone-from-identical-raw-source-checkpoint
    require_identical_parameter_count: true
    require_identical_initial_tensor_sha256: true
  control:
    endpoint_loss_weight: 0.0
  challenger:
    endpoint_loss_weight: 0.1
  only_changed_variable: endpoint_loss_weight
  required_equalities:
    - source checkpoint and initial tensor hash
    - parameter count and trainable tensors
    - frozen windows and batch order
    - optimizer and learning-rate schedule
    - batch composition and update count
    - clean teacher-forced and autonomous forward work
    - endpoint-loss computation before weighting
    - checkpoint, evaluation, hashing, and serialization work

training:
  screen_updates_per_arm: 200
  confirmation_updates_per_arm: 400
  batch_size: 16
  failure_windows_per_batch: 8
  matched_success_windows_per_batch: 8
  autonomous_unroll_steps: 8
  autonomous_state_forward: hard-thresholded-residue-bits
  autonomous_state_backward: sigmoid-straight-through
  clean_branch: eight-exact-teacher-forced-transitions
  optimizer: AdamW
  learning_rate: 0.000005
  minimum_learning_rate: 0.0000005
  schedule: cosine
  weight_decay: 0.00002
  gradient_clip: 2.0
  torch_threads: 4
  torch_interop_threads: 1
  deterministic_algorithms: true

loss:
  worst_bit_weight: 0.45
  quotient_weight: 0.10
  challenger_endpoint_weight: 0.10
  clean_transition_loss_per_step: mean_bit_bce + 0.45 * worst_position_mean_bce + 0.10 * quotient_cross_entropy
  base_clean_loss: mean of clean_transition_loss_per_step over the eight exact teacher-forced steps
  endpoint_logits: eighth-autonomous-transition-residue-bit-logits
  endpoint_target: exact-offline-eight-step-endpoint-residue-bits
  endpoint_loss: mean_bit_bce + 0.45 * worst_position_mean_bce
  endpoint_quotient_term: none
  total_loss: base_clean_loss + endpoint_loss_weight * endpoint_loss
  endpoint_loss_computed_for_both_arms: true

