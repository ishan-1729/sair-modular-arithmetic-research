schema_version: cuda-provider-control-v1
authorization:
  environment: SAIR_CLOUD_LAUNCH_APPROVED
  required_value: I_AUTHORIZE_PAID_GPU_LAUNCH RUNPOD_SECURE_RTX4090 NETWORK_VOLUME_GB_50 OFFPOD_SYNC_REQUIRED MAX_TOTAL_USD_9.00 MAX_PROVIDER_HOURS_10
budget:
  reserve_fraction: 0.15
  minimum_max_total_usd: 0.10
  include_provisioning_until_delete_confirmation: true
storage:
  require_network_volume: true
  require_controller_managed_network_volume: true
  minimum_network_volume_gb: 50
  require_verified_offpod_sync: true
  offpod_sync_interval_seconds: 300
  delete_network_volume_only_after_offpod_restore_verification: true
lifecycle:
  poll_seconds: 30
  running_poll_seconds: 300
  cleanup_headroom_seconds: 900
  request_timeout_seconds: 30
  destroy_timeout_seconds: 180
  destroy_retry_seconds: 5
  receipt_schema: cuda-provider-lifecycle-receipt-v1
guest:
  forbidden_fragments:
    - RUNPOD_API_KEY
    - SAIR_CLOUD_LAUNCH_APPROVED
    - "Authorization:"
providers:
  runpod:
    base_url: https://rest.runpod.io/v1
    credential_environment: RUNPOD_API_KEY
    create_method: POST
    create_path: /pods
    status_method: GET
    status_path: /pods?id={resource_id}
    delete_method: DELETE
    delete_path: /pods/{resource_id}
    network_volume_create_method: POST
    network_volume_create_path: /networkvolumes
    network_volume_status_method: GET
    network_volume_status_path: /networkvolumes/{network_volume_id}
    network_volume_delete_method: DELETE
    network_volume_delete_path: /networkvolumes/{network_volume_id}
    running_statuses: [RUNNING]
    terminal_statuses: [EXITED, TERMINATED]
