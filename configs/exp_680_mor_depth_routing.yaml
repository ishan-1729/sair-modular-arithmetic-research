source_mapping:
  token_unit: one-complete-arithmetic-instance-within-a-batch
  rationale: Candidate005 spatial positions are convolution-coupled; position sparsity would compute the dense convolution and cannot save calls.
  expert_choice_equation: at gate r select top-k eligible instance scores; only prior survivors may continue
  token_choice_equation: one initial three-way argmax assigns the complete recursion depth
  capacity_fractions: [1.0, 0.6666666666666666, 0.3333333333333333]
  load_loss: squared deviation of continuation probabilities from 2/3 then 1/2; token-choice mean probabilities from uniform 1/3
  inference: learned EMA score thresholds, deterministic CPU, sample-local, no batch top-k at release
  exclusions: [transformer-token-KV-cache, attention-caching-claims, GPU-kernels, oracle-depth-labels, answer-dependent-routing, M009a-sharing-layout]
library_decision:
  selected: torch-topk-index-select-index-copy-native
  torch: 2.5.1+cpu
  license: BSD-3-Clause
  reason: Native maintained primitives exactly express bounded sample routing with deterministic CPU parity; general MoE libraries add transformer/GPU-only machinery.
model: {hidden: 92, cycles: 2}
routing:
