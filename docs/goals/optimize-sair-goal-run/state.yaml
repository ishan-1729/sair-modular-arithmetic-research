version: 2

goal:
  title: "Optimize the SAIR Goal Run"
  slug: "optimize-sair-goal-run"
  kind: recovery
  tranche: "Diagnose the prior run, transfer validated process improvements, and execute successive reproducible algorithmic/model optimization packages until the full outcome is proven."
  status: active
  oracle:
    signal: "A reproducible, receipt-backed run whose selected improvements address trace evidence and whose registered experiments compare exact-answer accuracy against baselines on held-out seeds."
    cadence: "after each Worker package and at final audit"
    final_proof: "Trace diagnosis, TradeArch transfer map, verified run-control changes, project gate results, registered experiment evidence, and final Judge full_outcome_complete: true."
  intake:
    original_request: "Optimize the SAIR goal run by first inspecting session 019f522f-936f-77f1-a4b6-9ed26785b72b, using deep DSA and mathematical optimization, and learning from TradeArch result docs."
    interpreted_outcome: "Turn the stalled or suboptimal prior run into a trace-informed, benchmark-driven, continuously executable SAIR research program."
    input_shape: recovery
    audience: "SAIR research owner and future goal-run agents"
    authority: requested
    proof_type: artifact
    completion_proof: "A final Judge maps current receipts and reproducible verification/experiment evidence to every part of the original request."
    likely_misfire: "Produce a sophisticated survey or plan without improving execution, or optimize weak/public metrics instead of held-out exact-answer accuracy."
    blind_spots_considered:
      - "Competition trained-parameters boundary and prohibited arithmetic in submission inference"
      - "Public-seed overfitting and leakage"
      - "Compute budget and experiment throughput"
      - "Dirty-worktree ownership"
      - "False transfer from TradeArch"
      - "Premature completion after planning"
    existing_plan_facts:
      - "Inspect the named Agentic Traces before other substantive analysis."
      - "Use the TradeArch result documents as a process precedent, not an unquestioned solution."
      - "Use deep DSA, contest, Project Euler, and research results as sources of benchmarkable hypotheses."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

