      summary: "Audited TradeArch's 948-line optimization synthesis and 1,260-line execution Kanban. The transferable core is route-level optimization: compile reusable state once, pre-admit combinatorial/resource work, use bounded persistent process topology, apply decision-safe early stopping, stage static/focused/package/full gates, monitor completion events instead of polling, and scope every measurement. These directly address SAIR's repeated context scans, agent/wait explosion, fine-grained verification, and pre-scientific scaffolding. Do not copy TradeArch's mega-diff or reviewer density: its two result docs remain untracked, its candidate spans about 120 modifications plus 14 additions, and a fresh re-audit found 28 issues after an earlier clean verdict."
