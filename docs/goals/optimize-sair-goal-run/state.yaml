        - /mnt/d/Projects/TradeArch/docs/work/active-reviews/REPOSITORY_AUDIT_2026-07-17.md
        - /mnt/d/Projects/TradeArch/AGENTS.md
        - notes/T002-tradearch-transfer-audit.md
