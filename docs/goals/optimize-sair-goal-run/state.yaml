  - id: T004
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: high
    objective: "Build a constraint-aware DSA and mathematical-optimization hypothesis portfolio for the observed SAIR Tier-7+ failure surface, deduplicated against existing experiments and ranked by expected information gain per wall/CPU cost."
    inputs:
      - "T001 trace receipt"
      - "T002 TradeArch receipt"
      - "T003 SAIR repository receipt"
      - "Local primary-paper library and competition rules"
    constraints:
      - "Read-only; do not implement or train."
      - "Do not propose hand-coded modular multiplication, long division, Barrett/Montgomery reduction, or CRT recombination in submission inference."
      - "Use contest/DSA/Project-Euler-style ideas only as mathematical decompositions or learned inductive biases that remain compliant."
      - "For every hypothesis state the attacked failure mode, compliance argument, asymptotic/runtime expectation, cheapest falsifier, promotion threshold, and stop rule."
      - "Prefer primary research sources for technical claims; label remembered ideas as hypotheses until verified."
    expected_output:
      - "Deduplicated mathematical hypothesis portfolio"
      - "Dominance and incompatibility eliminations"
      - "Cost/information ranking"
      - "Top three experiment packages"
      - "goalbuddy_receipt_v1"
    receipt:
      result: done
      summary: "Width-256 failure is trajectory drift, not ordinary one-step incompetence: 99.70-99.75% teacher-forced transition accuracy yields only 22-32% exact rollout. Highest information-per-cost is tensor-native route calibration, followed by learned redundant state and a joint quotient/carry transducer; the already-built EXP-648 endpoint screen is scientifically direct but relatively expensive. Operand-swap complementarity is real, while consistency training failed, so preserve diverse equivariant views rather than forcing equality. Associative prefix composition is mathematically attractive but currently dominated by failed tree/macro-transition evidence. Exact hand-coded reduction, CRT, Barrett/Montgomery, long division, broad stochastic search, generic RAM, generic corruption, and undifferentiated depth expansion should not advance."
      evidence:
        - label: observed-current
          source: docs/goals/optimize-sair-goal-run/notes/T003-sair-current-state-audit.md
          finding: "Candidate 005 scores 0.593 independent and 0.595 checked overall, but returns zero above 128 bits; Tier 7-10 accuracy is structural 0.02 coincidence."
        - label: observed-current
          source: evals/results/exp-643-tier7-recurrent-depth-stability-diagnostic/metrics.json
          finding: "Two width-256 seeds achieved 0.9975/0.9970 transition accuracy but only 0.22/0.32 exact rollout; no overthinking signature was found."
        - label: derived
          source: "T003 measurements"
          finding: "Independent-error arithmetic predicts 0.997^256 approximately 0.463 and 0.9975^256 approximately 0.527, still above observed rollout; 90% rollout requires 0.90^(1/256)=0.999589 per step. The extra gap indicates teacher-forced distribution shift and correlated post-error drift."
        - label: observed-current
          source: submission/model.py
          finding: "Every 64/128-bit step rebuilds static multiplicand/modulus/marker planes from Python integers and decodes logits back to Python integers; widths above 128 are skipped."
        - label: observed-historical
          source: experiments/registry.yaml
          finding: "Prior work already covers soft/straight-through state, corruption, widening, correctors, refinement, confidence state, persistent latent state, beams, first-error replay, radix-4, tree composition, relative attention, macro transitions, commuted views, neural RAM, and depth diagnostics."
        - label: observed-historical
          source: evals/results/exp-647-operand-swap-consistency/metrics.json
          finding: "At width 256, control original/swapped/selected/oracle accuracies were 0.275/0.32/0.41/0.50, but consistency training reduced original accuracy to 0.25 and missed runtime and accuracy gates."
        - label: observed-historical
          source: knowledge/autoresearch/backlog.md
          finding: "EXP-610 generic corruption regressed heavily; EXP-613 learned corrector regressed; EXP-619 confidence state regressed; EXP-654 neural RAM/workspace produced zero exact trained-width rollout."
        - label: observed-current
          source: knowledge/autoresearch/state.yaml
          finding: "EXP-648 has no scientific result; its calibrated screen projects 4137.61 wall seconds and 15845.33 aggregate CPU seconds and remains separately authorization-blocked."
        - label: source-claim
          source: research/manifest.json
          finding: "The local inventory includes Neural GPU, Universal/Looped Transformers, Symbol-Equivariant RRM, LoopFormer, Mamba-2 hybrids, learned memory, and modular-arithmetic studies; inventory presence is not SAIR evidence."
      facts:
        - rank: 1
          hypothesis: "Tensor-native cached rollout representation"
          expected_information_gain_per_cost: "very high; minutes, no training"
          attacked_failure: "Python bit-plane reconstruction and decode/re-encode traffic currently make width-256 scientific tests expensive."
          mathematical_dsa_basis: "Store the residue as a thresholded bit tensor; precompute invariant multiplicand, modulus, LSB and MSB planes once; update only state and multiplier-bit planes. This is loop-invariant code motion and data-layout optimization."
          compliance: "Compliant if logits, thresholds, invalid-state behavior and final outputs remain bit-identical; it performs no arithmetic repair."
          cheapest_falsifier: "Prototype outside submission and compare exact logits, margins, predictions and malformed-state handling on fixed 64/128 cases; then time representative 256 rollouts."
          promotion_threshold: "Exact parity on all probes and at least 1.5x width-256 wall reduction without material RSS growth; submission integration requires frozen-candidate re-evaluation."
          stop_rule: "Stop on any semantic mismatch or less than 20% projected end-to-end screen reduction."
          known_prior_negative: "No direct negative; T003 identifies the route but no measurement exists."
        - rank: 2
          hypothesis: "Coupled redundant/error-correcting learned state"
          expected_information_gain_per_cost: "high; small-width corruption and short-rollout rung"
          attacked_failure: "A single wrong hard residue bit irreversibly moves the autoregressive process off its teacher-forced manifold."
          mathematical_dsa_basis: "Maintain two or three learned encodings of the same latent residue plus a learned syndrome/decoder; train agreement on clean states and recovery on naturally observed pre-first-error states. Redundancy converts silent state corruption into detectable disagreement."
          compliance: "Compliant when every redundant channel and decoder is learned end-to-end and inference contains no exact residue, parity, division, reduction or correction routine."
          cheapest_falsifier: "Width-16/32 matched control with one redundant plane; measure clean transition, recovery from held-out natural model errors, channel-ablation dependence and 16/32 short rollout."
          promotion_threshold: "At least 50% recovery of natural one-step errors, nontrivial dependence on each channel, at least +3 rollout points, no more than 1 point retention loss, and projected width-256 runtime within gate."
          stop_rule: "Stop if channels collapse to copies, ablation is inert, trained-width rollout is zero, or clean transition falls by more than 0.05 points."
          known_prior_negative: "EXP-613 corrector, EXP-619 confidence state, EXP-620 persistent latent state, and EXP-654 RAM/workspace failed; this survives only as explicitly coupled redundancy with natural-error supervision."
        - rank: 3
          hypothesis: "Joint quotient/carry finite-state transducer"
          expected_information_gain_per_cost: "high; cheap transition diagnostic before rollout"
          attacked_failure: "Rare width-dependent carry/reduction decisions dominate the approximately 0.25-0.30% transition tail."
          mathematical_dsa_basis: "For Horner state s, multiplicand a and bit b, the unreduced update 2s+ba lies below 3p, so the reduction quotient has only three classes. Train a local recurrent transducer to jointly predict quotient/carry channels and output bits using offline exact labels, allowing carries to propagate through learned recurrent state."
          compliance: "Offline exact quotient/carry labels are allowed; inference must use only learned predictions and must not subtract q*p or encode a hand-written carry/reduction circuit."
          cheapest_falsifier: "Attach auxiliary quotient/carry heads to a width-32/64 matched cellular control; test rare-class recall, causal head ablation, transition calibration and short autonomous rollout."
          promotion_threshold: "Rare quotient/carry recall at least 99.9%, causal ablation worsens errors, per-step exact accuracy approaches 99.96%, and rollout gains at least 3 points without runtime-gate failure."
          stop_rule: "Stop if the auxiliary state is ignored, improves labels but not rollout, or requires explicit arithmetic recombination."
          known_prior_negative: "EXP-230 quotient-routed experts already tested a routing formulation; Candidate 005 also retains an auxiliary quotient head at the smallest tier. The proposed hypothesis is narrower: joint local transduction at width 256, not expert routing."
        - rank: 4
          hypothesis: "Natural K-step endpoint consistency, existing EXP-648"
          expected_information_gain_per_cost: "medium; direct but about 69 wall minutes plus authorization"
          attacked_failure: "Teacher-forced transition loss does not train recovery across the natural autoregressive states that precede first failure."
          mathematical_dsa_basis: "Optimize compositions of the learned transition over K=8 natural windows so local errors are judged by their endpoint effect; this directly targets correlated error compounding."
          compliance: "Compliant: exact endpoints are offline labels, synthetic ambiguous corruption is excluded, and inference remains the learned recurrence."
          cheapest_falsifier: "The preregistered 200-update matched screen already exists; use decision-safe futility bounds during selection evaluation."
          promotion_threshold: "Existing gate: at least +3 width-256 rollout points, nonnegative clipped first-error movement, width-64/128 deltas at least -1 point, transition at least 99.5%, invalid at most 1%, determinism and integrity pass."
          stop_rule: "Stop when the attainable final accuracy interval cannot cross the gate; no confirmation if any binding retention, validity or integrity gate fails."
          known_prior_negative: "EXP-604/605 long-horizon recovery and EXP-616 trajectory CVaR failed; generic corruption in EXP-610 collapsed. EXP-648 itself is scientifically untested."
        - rank: 5
          hypothesis: "Diversity-preserving symmetry/equivariance"
          expected_information_gain_per_cost: "medium; frozen diagnostic followed by small matched A/B"
          attacked_failure: "Original and swapped operands expose complementary failure modes, but enforcing identical trajectories destroys useful diversity."
          mathematical_dsa_basis: "Modular multiplication is invariant under operand exchange, a two-element group action. Share an equivariant backbone or align only invariant endpoint features while retaining orientation-specific latent channels and a target-free confidence selector."
          compliance: "Compliant if no answer, benchmark identity or arithmetic circuit is encoded; both views remain learned predictions."
          cheapest_falsifier: "On frozen width-256 trajectories, quantify error overlap, selector calibration and representation alignment; train only a small invariant/shared adapter if complementarity remains."
          promotion_threshold: "Preserve oracle union near 50%, selected accuracy at least 43% on the screen, original accuracy no worse than -1 point, and projected routed runtime within the final gate."
          stop_rule: "Stop if alignment reduces error diversity, repeats EXP-647 consistency behavior, or needs unconditional double inference."
          known_prior_negative: "EXP-647 consistency regressed original width-256 rollout by 2.5 points; EXP-640 unconditional swap missed runtime. EXP-641/642 show conditional margin routing works at width 128."
        - rank: 6
          hypothesis: "Associative learned block maps with parallel-prefix composition"
          expected_information_gain_per_cost: "low-medium; mathematical upside but strong negative priors"
          attacked_failure: "A 256-step serial chain compounds errors and limits throughput."
          mathematical_dsa_basis: "Each multiplier bit induces a state map T_b; function composition is associative, allowing scan/tree depth O(log n) if a compact learned representation of block maps composes accurately."
          compliance: "Only a learned map representation and learned associative composer are allowed; no compiled arithmetic transition, exact reduction or hidden hand-coded solver."
          cheapest_falsifier: "At widths 8/16, test whether learned representations of 1-, 2-, 4- and 8-bit blocks satisfy endpoint accuracy and associativity residuals under both tree parenthesizations."
          promotion_threshold: "At least 99.9% 8-bit block endpoint accuracy, negligible parenthesization disagreement, nonzero width extrapolation, and a credible CPU speed projection."
          stop_rule: "Stop before width 256 if composition accuracy decays superlinearly, rollout is zero, or serial recurrence remains cheaper."
          known_prior_negative: "EXP-633 learned composition tree failed, EXP-630 radix-4 and EXP-637 macro transition were inadequate, and EXP-639 soft-boundary adaptation regressed. This route is dominated unless a tiny falsifier decisively clears them."
        - classification: reject-dominated-or-prohibited
          items: "Hand-coded modular multiplication, long division, Barrett/Montgomery reduction, CRT recombination, or exact quotient/carry recombination in inference: prohibited.,Generic random state corruption: dominated by EXP-610 and mathematically ambiguous off-manifold targets.,Generic error corrector, confidence plane, persistent latent state, or neural RAM without coupled-code diagnostics: dominated by EXP-613/619/620/654.,More recurrent-depth stability work without a new failure signature: dominated by EXP-643, which found no overthinking and contractive-looking proxies.,Unconditional commuted or stochastic breadth: dominated by EXP-640 runtime failure and EXP-649's 3150.9-second bound.,Parallel-prefix/tree scale-up before a tiny associativity test: dominated by EXP-630/633/637/639.,Pure Fourier/circular representation as the first width-256 bet: lacks a cheap exact-decoding path and risks smuggling exact modular structure; lower value than local transducer and redundancy tests."
      contradictions:
        - claim_a: "Width-256 transition accuracy is near-perfect."
          claim_b: "Width-256 exact rollout is only 22-32%."
          resolution: "There is no logical contradiction: 256 dependent transitions amplify a small tail, and observed rollout is worse than the independent-error estimate, indicating teacher-forced distribution shift or correlated failure."
        - claim_a: "Operand commutativity supplies a strong invariant."
          claim_b: "Commutative consistency training regressed."
          resolution: "The invariant is useful for complementary views and selection, but forcing latent/trajectory equality can erase diversity; equivariance must preserve orientation-specific error structure."
        - claim_a: "Associativity permits logarithmic-depth composition."
          claim_b: "Learned tree/macro approaches failed."
          resolution: "Associativity of exact functions does not imply a finite learned representation is closed or stable under approximate composition."
      ambiguity_requiring_judge:
