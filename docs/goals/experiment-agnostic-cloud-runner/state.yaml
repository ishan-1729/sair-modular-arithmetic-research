        - "A stale full-suite child survived its tool-cell termination; its exact PID was stopped before the authoritative final-byte suite continued."
      remaining_blockers: []
      verification_attempts: 2
  - id: T999
    type: pm
    assignee: PM
    status: done
    reasoning_hint: high
    objective: "Audit the final bytes against the experiment-agnostic oracle and the user's request."
    inputs:
      - "T001 receipt"
      - "Final diff"
      - "Focused and full verification receipts"
      - "Installed skill validation"
    constraints:
      - "Do not implement new behavior during the audit."
      - "Reject completion if the core contains EXP701-specific assumptions or the public lifecycle is only scaffolded."
      - "Require full_outcome_complete: true before closing."
    expected_output:
      - "complete | not_complete"
      - "full_outcome_complete: true | false"
      - "evidence mapped to the original request"
    receipt:
      result: done
      decision: complete
      full_outcome_complete: true
      rationale: "The public control plane contains no experiment identity or scientific assumptions; arbitrary commands, outputs, phases, checkpoints, provider driver, hardware, and budgets come only from the validated manifest. A synthetic interrupted experiment proves the full public route, safety failures fail closed, the thin skill delegates to the tested CLI, and focused/project/full verification passes."
      evidence:
        - "tools/cloud_experiment/"
        - "tests/test_cloud_experiment_runner.py: 17 passed"
        - "full project suite: 1228 passed, 4 intentional skips"
        - "knowledge/runbooks/experiment-agnostic-cloud-runner.md"
