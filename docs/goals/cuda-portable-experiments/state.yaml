version: 2

goal:
  title: "CUDA-Portable Experiments"
  slug: cuda-portable-experiments
  kind: existing_plan
  tranche: "Mechanically close scope, port performance-credible experiment families, package a reproducible cloud runtime, and require real GPU evidence before hardware validation."
  status: active
  oracle:
    signal: "A generated inventory closes every reachable experiment and device hotspot; the committed branch passes locked fresh-environment and clean CPU regression gates; and a real GPU receipt covers every ported family before plug-and-play is claimed."
    cadence: "after each Worker package and at final audit"
    final_proof: "A final Judge maps the generated inventory, branch commit, single clean-clone regression run, locked bootstrap, provider billing controls, and real GPU acceptance receipt to the original request before full_outcome_complete: true."
  intake:
    original_request: "Create another branch where the relevant experiments part of the entire repo is ported to CUDA for plug-and-play cloud GPU use."
    interpreted_outcome: "A separate branch is first delivered as cuda-prepared-hardware-unvalidated, then becomes plug-and-play only after the exact commit and locked environment pass a real GPU acceptance matrix."
    input_shape: existing_plan
    audience: "Repository owner renting a cloud GPU"
    authority: requested
    proof_type: test
    completion_proof: "Mechanical scope closure, reproducible environment and CPU proof, billing-safe launch controls, plus real CUDA acceptance on the exact commit."
    likely_misfire: "Adding a global CUDA flag or porting only EXP699 while leaving hidden CPU tensor construction and unsupported experiment families undiscovered."
    blind_spots_considered:
      - "Not every experiment benefits from CUDA; CPU-only orchestration and exact-label generation must remain classified rather than force-ported."
      - "A machine without a GPU cannot prove physical CUDA execution, so the branch needs a fail-closed hardware acceptance command for the future VM."
      - "Historical experiments have frozen hashes and provenance contracts that must not be silently invalidated."
      - "The existing EXP699 replay has CPU parity but has never executed a CUDA step."
      - "Per-position CPU transfers in recurrent loops may make the GPU path slower."
      - "The existing bootstrap assumes uv and lacks a complete hashed transitive lock and driver/compute-capability gate."
      - "Process timeouts do not terminate cloud billing, and scoped route time undercounts provider lifetime."
      - "The prior repository validation was fragmented rather than one final clean-clone pass."
    existing_plan_facts:
      - "Create a new branch and isolated worktree."
      - "Port the relevant experiments area, not immutable sources or external data."
      - "Reuse the EXP699 CUDA replay lessons without modifying its consumed scientific root."
      - "Provide exact requirements files and uv-based cloud bootstrap."
      - "Do not launch long local experiments."
      - "Do not call preparation plug-and-play; use cuda-prepared-hardware-unvalidated until real GPU acceptance passes."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

