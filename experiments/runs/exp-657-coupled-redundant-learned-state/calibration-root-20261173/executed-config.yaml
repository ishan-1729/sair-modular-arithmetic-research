run_id: exp-657-coupled-redundant-learned-state
hypothesis: Two separately learned persistent residue-belief planes, coupled only
  through a learned syndrome, learned corrections, and a learned fusion decoder, recover
  naturally occurring one-step errors often enough to improve width-32 exact autonomous
  rollout over an exactly parameter-matched single-persistent-state control without
  harming clean transitions or width-16 retention.
