    maximum_challenger_invalid_rollout_rate: 0.01
    require_exact_repeat_and_determinism: true
    require_integrity: true
  pooled_width256_paired_cases: 1000
  pooled_exact_conditional_bound:
    recovered_symbol: b
    introduced_drift_symbol: c
    denominator: 1000
    alpha: 0.05
    sidedness: one-sided
    conditional_success_parameter: b / (b + c)
    clopper_pearson_lower: "0 if b == 0; otherwise BetaQuantile(0.05, b, c + 1)"
    net_exact_gain_lower: (2 * clopper_pearson_lower - 1) * (b + c) / 1000
    no_discordant_cases_rule: "if b + c == 0, net_exact_gain_lower = 0"
    gate: net_exact_gain_lower > 0
  decision_if_any_pair_or_pooled_gate_misses: reject-frozen-confirmation
  interpretation_if_all_gates_pass: supports-only-a-separate-candidate-and-tier7-preregistration
  direct_candidate_promotion: prohibited

