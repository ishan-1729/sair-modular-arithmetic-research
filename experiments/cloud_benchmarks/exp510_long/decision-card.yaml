hypothesis_or_requirement: >-
  The sustained Codex Cloud CPU route materially changes the wall time of the
  unchanged six-arm EXP-510 workload relative to its durable laptop baseline.
measured_failure_or_need: >-
  The earlier Candidate 005 comparison was too short for cold-start overhead
  and sustained training throughput to be separated confidently.
