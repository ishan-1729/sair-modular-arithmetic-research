changed_variable: >-
  Execution platform and Python patch version. The benchmark keeps the exact
  runner, config, model sources, seeds, workload, Torch, NumPy, PyG, MLflow,
  psutil, and four-thread setting. Cloud dependencies are installed from the
  adjacent requirements.txt by uv.
public_route: >-
  uv environment setup -> unchanged EXP-510 runner -> six complete 8,000-step
  arms -> generated transition and rollout evaluation -> measured receipt.
smallest_falsifier: >-
  One complete unchanged EXP-510 execution whose source hashes pass and whose
  result structure covers all three seeds and both architectures.
primary_oracle: sustained runner wall time with runner aggregate CPU time
promotion_gate: >-
  Report the observed speed ratio only after the full route completes and its
  generated exact-answer metrics are reconciled with the historical receipt.
futility_or_stop_rule: >-
  Stop only on an execution failure, a source/dependency identity mismatch, or
  a five-hour cloud runner wall ceiling.
retention_and_safety_gates:
  - Do not read checked, consumed independent, official/private, or benchmark answers.
  - Do not alter the original EXP-510 runner, config, or model sources.
  - Do not treat checkpoint hash drift across CPU platforms as accuracy evidence.
