limitations:
  - The first slice may need a later same-root resume because the conservative projection extends to 12 hours.
  - No paid provider action is authorized by this preflight.
  - No official/private answers are present in the launch payload.
  - The network-volume data center must be bound from fresh read-only Secure RTX4090 availability before any paid create request; the dry plan uses an explicit placeholder.
  - A network volume is not treated as indefinite protection at zero balance; the external restore-verified copy is mandatory and the controller deletion-confirms both resources.
